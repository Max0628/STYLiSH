<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>行銷活動管理</title>
    <style>
        body {
          font-family: Arial, sans-serif;
          margin: 20px;
        }
        .campaign-entry {
          display: flex;
          align-items: center;
          gap: 10px;
          margin-bottom: 10px;
        }
        .campaign-entry input,
        .campaign-entry select,
        .campaign-entry button {
          padding: 5px;
        }
        .button-group {
          margin-top: 20px;
        }
    </style>
</head>
<body>

<h2>行銷活動管理表單</h2>

<form id="campaign-form">
    <div id="campaign-container">
        <!-- 動態新增欄位 -->
    </div>

    <div class="button-group">
        <button type="button" id="add-entry">新增欄位</button>
        <button type="submit">送出</button>
    </div>
</form>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function() {
      let entryIndex = 0;
      let productOptions = []; // 儲存API回傳的商品資料

      // 載入商品清單
      $.ajax({
        //url: 'https://localhost:8443/api/v1/marketing/getAllProductIdAndTitle',
        url: 'http://localhost:8080/api/v1/marketing/getAllProductIdAndTitle',
        type: 'GET',
        success: function(response) {
          if (response && response.data) {
            productOptions = response.data;
            createEntry(); // 載入完後建一個初始欄位
          }
        },
        error: function(xhr, status, error) {
          alert('取得商品資料失敗: ' + error);
        }
      });

      function createEntry() {
        const selectOptions = productOptions.map(product =>
          `<option value="${product.id}">${product.title}</option>`
        ).join('');

        const entry = $(`
          <div class="campaign-entry" data-index="${entryIndex}">
            <select name="product_id">
              <option value="">請選擇商品</option>
              ${selectOptions}
            </select>
            <input type="text" name="story" placeholder="輸入行銷文案" />
            <input type="file" name="picture" />
            <button type="button" class="delete-entry">刪除</button>
          </div>
        `);

        $('#campaign-container').append(entry);
        entryIndex++;
      }

      $('#add-entry').click(function() {
        createEntry();
      });

      $('#campaign-container').on('click', '.delete-entry', function() {
        $(this).closest('.campaign-entry').remove();
      });

      $('#campaign-form').submit(function(e) {
    e.preventDefault();

    const formData = new FormData();

    $('.campaign-entry').each(function(index, element) {
      const productId = $(element).find('select[name="product_id"]').val();
      const story = $(element).find('input[name="story"]').val();
      const file = $(element).find('input[type="file"]')[0].files[0];

      formData.append(`campaignForms[${index}].productId`, productId);
      formData.append(`campaignForms[${index}].story`, story);
      if (file) {
        formData.append(`campaignForms[${index}].picture`, file);
      }
    });

    //fetch('https://localhost:8443/api/v1/marketing/insertCampaignProduct', {
    fetch('http://localhost:8080/api/v1/marketing/insertCampaignProduct', {
      method: 'POST',
      body: formData,
    })
    .then(response => {
      if (!response.ok) {
        throw new Error('送出失敗');
      }
      return response.json();
    })
    .then(data => {
      alert('送出成功！');
      console.log(data);
    })
    .catch(error => {
      alert('送出失敗: ' + error.message);
    });
  });

    });
</script>

</body>
</html>
