spring.application.name=STYLiSH

# Server
server.port=${SERVER_PORT:8080}

# Web encoding
spring.web.encoding.charset=UTF-8
spring.web.encoding.enabled=true
spring.web.encoding.force=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=${JWT_EXPIRATION_MS:3600000}

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# Upload config
upload.path=${UPLOAD_PATH:/tmp/uploads}
upload.domain=${UPLOAD_DOMAIN:http://localhost:8080}
upload.url-path=${UPLOAD_URL_PATH:/images}

# MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=PT6S
spring.data.campaign.cache.key=${REDIS_CAMPAIGNS_KEY:stylish:campaigns:all}
spring.data.redis.ssl.enabled=true
spring.data.redis.lettuce.ssl.verify-peer=false
# Rate Limiter
rate.limiter.max-requests=${RATE_LIMITER_MAX_REQUESTS:10}
rate.limiter.window-millis=${RATE_LIMITER_WINDOW_MS:1000}

# Message Queue
queue.payment.report.key=${QUEUE_PAYMENT_REPORT_KEY:payment_report_job_queue}

# TapPay
tappay.partner-key=${TAPPAY_PARTNER_KEY}
tappay.merchant-id=${TAPPAY_MERCHANT_ID}
tappay.api-url=${TAPPAY_API_URL:https://sandbox.tappaysdk.com}
